<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f7">
  <meta name="description" content="Andrés Zambrana, desarrollador de apps. Proyectos y enlaces personales.">
  <title>Andrés Zambrana · Enlaces</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 28px 18px; color: #20242b; background: radial-gradient(circle at 50% 38%, #fff 0, #fafaf9 52%, #f1f1ef 100%); }
    .card { width: min(100%, 430px); padding: clamp(26px, 7vw, 42px); border: 1px solid rgba(255,255,255,.9); border-radius: 28px; background: rgba(255,255,255,.68); box-shadow: 0 22px 65px rgba(28,32,37,.08), 0 1px 4px rgba(28,32,37,.08), inset 0 1px 0 #fff; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .identity { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .avatar { flex: none; width: 68px; height: 68px; display: grid; place-items: center; border-radius: 50%; background: #eaeae8; color: #2e333b; font-size: 23px; font-weight: 500; letter-spacing: -.04em; }
    h1 { margin: 0 0 3px; font-size: clamp(22px, 6vw, 28px); line-height: 1.12; letter-spacing: -.045em; }
    .handle { margin: 0; color: #737780; font-size: 15px; }
    .divider { height: 1px; margin: 28px 0 24px; background: #e6e7e7; }
    .bio { margin: 0 0 28px; color: #555c65; line-height: 1.55; font-size: 16px; }
    .links { display: grid; gap: 12px; }
    .link { min-height: 72px; display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: 1px solid #e6e7e8; border-radius: 19px; background: rgba(255,255,255,.7); box-shadow: 0 2px 6px rgba(28,32,37,.025); color: inherit; text-decoration: none; font-size: 17px; font-weight: 500; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .link:hover { transform: translateY(-2px); border-color: #c9cdd1; box-shadow: 0 9px 20px rgba(28,32,37,.07); }
    .link:focus-visible { outline: 3px solid #6a7889; outline-offset: 3px; }
    .link svg, .link img { width: 23px; height: 23px; flex: none; }
    .link svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .brand-icon { object-fit: contain; }
    .arrow { margin-left: auto; color: #858991; }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <header class="identity">
      <div class="avatar" aria-hidden="true">AZ</div>
      <div><h1 id="name">Andrés Zambrana</h1><p class="handle">Desarrollador de apps</p></div>
    </header>
    <div class="divider" aria-hidden="true"></div>
    <p class="bio">Actualmente estudio DAM. Hago proyectos en mi tiempo libre y los comparto.</p>
    <nav class="links" aria-label="Mis enlaces">
      <a class="link" href="https://github.com/andreszambranalinares-stack" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.3-4.3-2.5-6-3m12 6v-3.3a2.9 2.9 0 0 0-.8-2.3c2.7-.3 5.5-1.3 5.5-6A4.7 4.7 0 0 0 18.4 7 4.3 4.3 0 0 0 18.3 4S17 3.7 15 5a10.3 10.3 0 0 0-6 0C7 3.7 5.7 4 5.7 4A4.3 4.3 0 0 0 5.6 7 4.7 4.7 0 0 0 4.3 10.4c0 4.7 2.8 5.7 5.5 6A2.9 2.9 0 0 0 9 18.7V22"/></svg>GitHub<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
      <a class="link" href="https://jerez-bus-facil.andreszambranalinare.chatgpt.site/" target="_blank" rel="noopener noreferrer"><img class="brand-icon" src="jerezbus-icon-bn.png" alt="">JerezBus<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
      <a class="link" href="mailto:andreszambranalinares@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/></svg>Contacto<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
    </nav>
  </main>
</body>
</html>
